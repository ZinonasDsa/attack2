<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Συμμετοχή στην κλήρωση</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .box {
            padding: 40px;
            max-width: 600px;
        }

        h1 {
            font-size: 30px;
        }

        .loader {
            width: 45px;
            height: 45px;

            border: 5px solid #444;
            border-top: 5px solid white;
            border-radius: 50%;

            margin: 30px auto;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="box" id="content">

    <h1>🎁 Καταχώρηση συμμετοχής...</h1>

    <p>Παρακαλώ περιμένετε.</p>

    <div class="loader"></div>

</div>

<script>

setTimeout(function () {

    document.getElementById("content").innerHTML = `
        <h1>⚠️ ΠΡΟΣΟΧΗ!</h1>

        <p>
            Μόλις σκανάρατε ακόμη ένα QR Code
            χωρίς να γνωρίζετε ακριβώς πού οδηγεί.
        </p>

        <p>
            Αυτό ήταν μέρος της άσκησης
            κυβερνοασφάλειας.
        </p>

        <p>
            🔐 Δεν συλλέχθηκαν προσωπικά δεδομένα.
        </p>

        <p>
            <strong>
                Να ελέγχετε πάντα ένα QR Code
                πριν ανοίξετε τον σύνδεσμό του.
            </strong>
        </p>
    `;

}, 1500);

</script>

</body>
</html>
